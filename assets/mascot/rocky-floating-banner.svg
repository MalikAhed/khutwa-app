<svg xmlns="http://www.w3.org/2000/svg" id="krf-banner" viewBox="0 0 800 620" width="800" height="620" fill="none" role="img" aria-labelledby="krf-title krf-description" preserveAspectRatio="xMidYMid meet">
  <title id="krf-title">Rocky floating with hearts and gems</title>
  <desc id="krf-description">The original Rocky mascot gently floats with small movements in his raised hands and detached feet. Two hearts and two gems drift around him. Transparent background; reduced-motion preferences are respected.</desc>
  <style>
/* All animation is native CSS. The original visible SVG paths are preserved. */
#krf-banner { display: block; width: 100%; height: auto; overflow: hidden; }
#krf-banner .krf-motion {
  transform-box: view-box;
  transform-origin: 0 0;
  animation-timing-function: cubic-bezier(.37, 0, .63, 1);
  animation-iteration-count: infinite;
  animation-fill-mode: both;
}
#krf-banner .krf-rocky-x { animation-name: krf-rocky-x; animation-duration: 12.8s; animation-delay: -3.2s; }
#krf-banner .krf-rocky-y { animation-name: krf-rocky-y; animation-duration: 6.4s; }
#krf-banner .krf-rocky-roll { animation-name: krf-rocky-roll; animation-duration: 12.8s; animation-delay: -2.1s; }
#krf-banner .krf-arm-left { animation-name: krf-arm-left; animation-duration: 6.4s; animation-delay: -.24s; }
#krf-banner .krf-arm-right { animation-name: krf-arm-right; animation-duration: 6.4s; animation-delay: -.62s; }
#krf-banner .krf-foot-left { animation-name: krf-foot-left; animation-duration: 6.4s; animation-delay: -.48s; }
#krf-banner .krf-foot-right { animation-name: krf-foot-right; animation-duration: 6.4s; animation-delay: -.76s; }
#krf-banner .krf-orbit-x { animation-name: krf-orbit-x; animation-duration: var(--krf-time); animation-delay: var(--krf-x-delay); }
#krf-banner .krf-orbit-y { animation-name: krf-orbit-y; animation-duration: var(--krf-time); animation-delay: var(--krf-y-delay); }
#krf-banner .krf-orbit-roll { animation-name: krf-orbit-roll; animation-duration: var(--krf-time); animation-delay: var(--krf-roll-delay); }
@keyframes krf-rocky-x {
  0%, 100% { transform: translateX(-3px); }
  50% { transform: translateX(3px); }
}
@keyframes krf-rocky-y {
  0%, 100% { transform: translateY(10px); }
  50% { transform: translateY(-13px); }
}
@keyframes krf-rocky-roll {
  0%, 100% { transform: rotate(-1.15deg); }
  50% { transform: rotate(1.15deg); }
}
@keyframes krf-arm-left {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3.5deg); }
}
@keyframes krf-arm-right {
  0%, 100% { transform: rotate(3.5deg); }
  50% { transform: rotate(-3deg); }
}
@keyframes krf-foot-left {
  0%, 100% { transform: translateY(1.5px) rotate(-4deg); }
  50% { transform: translateY(-1.5px) rotate(4deg); }
}
@keyframes krf-foot-right {
  0%, 100% { transform: translateY(-1px) rotate(4deg); }
  50% { transform: translateY(2px) rotate(-4deg); }
}
@keyframes krf-orbit-x {
  0%, 100% { transform: translateX(var(--krf-x-min)); }
  50% { transform: translateX(var(--krf-x-max)); }
}
@keyframes krf-orbit-y {
  0%, 100% { transform: translateY(var(--krf-y-min)); }
  50% { transform: translateY(var(--krf-y-max)); }
}
@keyframes krf-orbit-roll {
  0%, 100% { transform: rotate(var(--krf-roll-min)); }
  50% { transform: rotate(var(--krf-roll-max)); }
}
@media (prefers-reduced-motion: reduce) {
  #krf-banner .krf-motion { animation: none !important; }
}
/* Optional host control when this SVG is inlined. */
#krf-banner[data-paused="true"] .krf-motion { animation-play-state: paused; }
</style>
