name: Publish Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/server/**'
      - 'src/server/static-files.mjs'
      - 'assets/**'
      - 'index.html'
      - 'content-worker.js'
      - 'package*.json'
      - 'jsconfig.json'
      - 'scripts/package*.mjs'
      - 'scripts/content-manifest.mjs'
      - 'scripts/version-preview.mjs'
      - '.github/cloudflare/**'
      - '.github/workflows/cloudflare-pages.yml'
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_DIR: _site
      CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
    steps:
      - name: Check out the approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fast checks and one build
        run: npm run release
      - name: Test the release against the existing staging account service
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.154.0'
          command: pages deploy _site --project-name=khutwaa --branch=account-service-check --commit-dirty=false
      - name: Verify the candidate before changing production
        if: steps.preview.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
        run: node .github/cloudflare/verify-deployment.mjs
      - name: Publish the same build to production
        if: steps.preview.outcome == 'success'
        id: publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.154.0'
          command: pages deploy _site --project-name=khutwaa --branch=main --commit-dirty=false
      - name: Verify production
        if: steps.publish.outcome == 'success'
        env:
          DEPLOYMENT_URL: https://khutwaa.pages.dev
        run: node .github/cloudflare/verify-deployment.mjs
