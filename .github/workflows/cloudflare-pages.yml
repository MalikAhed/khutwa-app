name: Publish Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the published runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare the website files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/khutwa-site"
          git archive HEAD | tar -x --exclude=.github --exclude=README.md -C "$RUNNER_TEMP/khutwa-site"
          # Pages skips node_modules; retain its public URLs through a rewrite.
          mv "$RUNNER_TEMP/khutwa-site/node_modules" "$RUNNER_TEMP/khutwa-site/assets/browser-libraries"
          {
            printf '/node_modules/* /assets/browser-libraries/:splat 200\n'
            if [ -f "$RUNNER_TEMP/khutwa-site/_redirects" ]; then
              cat "$RUNNER_TEMP/khutwa-site/_redirects"
            fi
          } > "$RUNNER_TEMP/khutwa-redirects"
          mv "$RUNNER_TEMP/khutwa-redirects" "$RUNNER_TEMP/khutwa-site/_redirects"
          sed -i 's/name="learn-account-mode" content="fixture"/name="learn-account-mode" content="http"/' "$RUNNER_TEMP/khutwa-site/index.html"
          grep -q 'name="learn-account-mode" content="http"' "$RUNNER_TEMP/khutwa-site/index.html"
          cp .github/cloudflare/worker.mjs "$RUNNER_TEMP/khutwa-site/_worker.js"
          cp .github/cloudflare/routes.json "$RUNNER_TEMP/khutwa-site/_routes.json"
      - name: Test the release against the existing staging account service
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.154.0'
          command: pages deploy ${{ runner.temp }}/khutwa-site --project-name=khutwaa --branch=account-service-check --commit-dirty=false
      - name: Verify the candidate before changing production
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
        run: node .github/cloudflare/verify-deployment.mjs
      - name: Publish to the existing production account service
        id: publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.154.0'
          command: pages deploy ${{ runner.temp }}/khutwa-site --project-name=khutwaa --branch=main --commit-dirty=false
      - name: Verify production account routing
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: node .github/cloudflare/verify-deployment.mjs
